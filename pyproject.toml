[project]
name = "catholic-mass-times-scraper"
version = "0.1.0"
description = "Automated Catholic mass times scraper for CR Community News"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# --- Pytest Configuration ---
# This tells pytest where to find tests and how to run them.
# Run tests with:  pytest
# Run with detail:  pytest -v
# Run with coverage:  pytest --cov=src --cov=dashboard/app
testpaths = ["tests"]
pythonpath = [".", "dashboard"]

[tool.coverage.run]
# Which source directories to measure code coverage for
source = ["src", "dashboard/app"]

[tool.coverage.report]
omit = ["tests/*", "config/*"]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]
