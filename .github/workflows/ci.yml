name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff==0.4.*
      - run: ruff format --check .
      - run: ruff check .

  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: pip install -r dashboard/requirements.txt
      - name: Run tests
        run: pytest --cov=src --cov=dashboard/app --cov-report=term-missing --cov-report=xml -v
        env:
          DATA_DIR: tests/fixtures/data_output
      - uses: actions/upload-artifact@v4
        with: { name: coverage-report, path: coverage.xml, retention-days: 14 }
