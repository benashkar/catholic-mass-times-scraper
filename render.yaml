# render.yaml -- Catholic Church Scraper + Dashboard
# All services use Docker runtime per global rules.
# Region: Virginia (co-located with db99 RDS in us-east-1).

services:
  # Dashboard: Flask web app serving mass times + bulletin names from db99
  - type: web
    name: catholic-church-dashboard
    runtime: docker
    dockerfilePath: dashboard/Dockerfile
    region: virginia
    plan: starter
    envVars:
      - key: FLASK_APP
        value: app
      - key: SECRET_KEY
        generateValue: true
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: us-east-1

  # Mass times pipeline: scrape mass times -> sync to db99 -> redeploy dashboard
  # Runs every day EXCEPT Tuesday at 3 AM UTC (Tuesday handled by bulletin job)
  - type: cron_job
    name: church-mass-times-cron
    runtime: docker
    dockerfilePath: Dockerfile.cron
    region: virginia
    plan: standard
    schedule: "0 3 * * 0,1,3,4,5,6"
    # Sharded DiscoverMass refresh: each of the 6 weekly fires does ~1/6 of states
    # (whole country weekly) and finishes in its window. CatholicIndex is dead
    # (Cloudflare), so run_daily_pipeline/scrape_to_db99 no longer refreshes mass
    # times; run_discovermass_all is the live source. --stale-days 6 skips churches
    # already refreshed this cycle so partial/re-runs self-heal cheaply.
    startCommand: "python run_discovermass_all.py --shard-dow --stale-days 6"
    envVars:
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: us-east-1
      - key: RENDER_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GIT_AUTHOR_NAME
        value: "Ben Ashkar"
      - key: GIT_AUTHOR_EMAIL
        sync: false
      - key: GIT_COMMITTER_NAME
        value: "Ben Ashkar"
      - key: GIT_COMMITTER_EMAIL
        sync: false

  # Walled-host recovery: a headless browser THROUGH the residential proxy, for
  # hosts labelled 'blocked'. This recovered +5,532 churches nationally over
  # 2026-08-18..21 — and every one of those runs was launched BY HAND. Nothing
  # scheduled ran it, so the moment nobody was watching, churches needing
  # browser+proxy would have gone quietly back to yielding zero.
  #
  # It gets its OWN cron rather than living inside the bulletin sweep because a
  # Chromium per blocked host alongside spaCy and pdfplumber does not fit 2GB —
  # enabling it inline OOM-killed three shards on its first outing.
  #
  # 05:00 UTC, two hours clear of the 03:00 bulletin cron so they never share
  # the box. States are ordered by CURRENT gap and round-robined into 7 buckets,
  # so every state is retried weekly and the biggest gaps are always in rotation.
  - type: cron_job
    name: church-walled-sweep
    runtime: docker
    dockerfilePath: Dockerfile.cron
    region: virginia
    plan: standard
    schedule: "0 5 * * *"
    startCommand: "python -u run_walled_sweep.py"
    envVars:
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: us-east-1
      - key: PROXY_URL
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  # Bulletin pipeline: bulletin PDF collection + NER + rescore + redeploy
  # Runs every Tuesday at 3 AM UTC (mass times handled by mass-times cron)
  - type: cron_job
    name: church-bulletin-cron
    runtime: docker
    dockerfilePath: Dockerfile.cron
    region: virginia
    plan: standard
    schedule: "0 3 * * 2"
    startCommand: "python run_daily_pipeline.py --bulletins-only"
    envVars:
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: us-east-1
      - key: RENDER_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GIT_AUTHOR_NAME
        value: "Ben Ashkar"
      - key: GIT_AUTHOR_EMAIL
        sync: false
      - key: GIT_COMMITTER_NAME
        value: "Ben Ashkar"
      - key: GIT_COMMITTER_EMAIL
        sync: false
