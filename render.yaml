# render.yaml — Catholic Church Dashboard
# Uses native Python runtime (not Docker) for simplicity.
# The entire repo is cloned, so data/output/ CSVs are available.

services:
  - type: web
    name: catholic-church-dashboard
    runtime: python
    region: ohio
    plan: starter
    rootDir: dashboard
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --preload "app:create_app()"
    envVars:
      - key: FLASK_APP
        value: app
      - key: DATA_DIR
        value: ../data/output
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.0"
