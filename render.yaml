# render.yaml -- Catholic Church Scraper + Dashboard
# All services use Docker runtime per global rules.
# Region: Virginia (co-located with db99 RDS in us-east-1).

services:
  # Dashboard: Flask web app serving mass times + bulletin names from db99
  - type: web
    name: catholic-church-dashboard
    runtime: docker
    dockerfilePath: dashboard/Dockerfile
    region: virginia
    plan: starter
    envVars:
      - key: FLASK_APP
        value: app
      - key: SECRET_KEY
        generateValue: true
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: us-east-1

  # Daily pipeline: scrape mass times -> sync to db99 -> redeploy dashboard
  # Runs every day EXCEPT Tuesday at 3 AM UTC (Tuesday handled by weekly job)
  - type: cron_job
    name: church-daily-scrape
    runtime: docker
    dockerfilePath: Dockerfile.cron
    region: virginia
    plan: starter
    schedule: "0 3 * * 0,1,3,4,5,6"
    startCommand: "python run_weekly_pipeline.py --skip-bulletins"
    envVars:
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: us-east-1
      - key: RENDER_API_KEY
        sync: false
      - key: GIT_AUTHOR_NAME
        value: "Ben Ashkar"
      - key: GIT_AUTHOR_EMAIL
        sync: false
      - key: GIT_COMMITTER_NAME
        value: "Ben Ashkar"
      - key: GIT_COMMITTER_EMAIL
        sync: false

  # Weekly pipeline: full scrape + bulletin PDF extraction -> sync to db99 -> redeploy
  # Runs every Tuesday at 3 AM UTC
  - type: cron_job
    name: church-weekly-bulletins
    runtime: docker
    dockerfilePath: Dockerfile.cron
    region: virginia
    plan: starter
    schedule: "0 3 * * 2"
    startCommand: "python run_weekly_pipeline.py"
    envVars:
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: us-east-1
      - key: RENDER_API_KEY
        sync: false
      - key: GIT_AUTHOR_NAME
        value: "Ben Ashkar"
      - key: GIT_AUTHOR_EMAIL
        sync: false
      - key: GIT_COMMITTER_NAME
        value: "Ben Ashkar"
      - key: GIT_COMMITTER_EMAIL
        sync: false
